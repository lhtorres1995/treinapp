name: Backup Supabase

# Backup automático do banco (plano Free não tem backup confiável nem PITR).
# Roda todo dia e guarda um dump completo (schema + dados) como artefato.

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC = 03:00 no horário de Brasília
  workflow_dispatch: {}    # permite rodar manualmente pelo botão "Run workflow"

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Gerar dump (pg_dump via Postgres 15, versão compatível)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "Secret SUPABASE_DB_URL não configurado." >&2
            exit 1
          fi
          STAMP=$(date +%Y-%m-%d_%H%M)
          docker run --rm -v "$PWD:/out" postgres:15 \
            pg_dump "$SUPABASE_DB_URL" \
              --no-owner --no-privileges -Fc \
              -f "/out/lt360-backup-$STAMP.dump"
          ls -lh lt360-backup-*.dump

      - name: Enviar o backup como artefato
        uses: actions/upload-artifact@v4
        with:
          name: lt360-supabase-backup
          path: lt360-backup-*.dump
          retention-days: 90
